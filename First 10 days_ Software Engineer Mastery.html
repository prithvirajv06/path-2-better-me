<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First 10 days: Software Engineer Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F6FA;
  --surface: #FFFFFF;
  --ink: #14213D;
  --ink-2: #4A5878;
  --rule: #D5DDEA;
  --grid: rgba(35, 70, 200, 0.06);
  --blue: #2346C8;
  --blue-soft: #E3E9FB;
  --mark: #FFE066;
  --done: #2F8F5B;
  --done-soft: #DDF1E5;
  --code-bg: #0F1A33;
  --code-ink: #DCE5F7;
  --code-dim: #8C9BBA;
  --seg-1: #C9D4F3;
  --seg-2: #8EA4EA;
  --seg-3: #2346C8;
  --seg-4: #FFE066;
  --seg-ink-3: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1420;
    --surface: #151D2E;
    --ink: #E6ECF7;
    --ink-2: #A3B0CC;
    --rule: #26314A;
    --grid: rgba(143, 168, 255, 0.05);
    --blue: #8FA8FF;
    --blue-soft: #1D2A4D;
    --mark: #6F5D12;
    --done: #6CD39A;
    --done-soft: #16352A;
    --code-bg: #0A0F1A;
    --code-ink: #DCE5F7;
    --code-dim: #7D8BA8;
    --seg-1: #26355E;
    --seg-2: #3A519A;
    --seg-3: #8FA8FF;
    --seg-4: #6F5D12;
    --seg-ink-3: #0E1420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1420;
  --surface: #151D2E;
  --ink: #E6ECF7;
  --ink-2: #A3B0CC;
  --rule: #26314A;
  --grid: rgba(143, 168, 255, 0.05);
  --blue: #8FA8FF;
  --blue-soft: #1D2A4D;
  --mark: #6F5D12;
  --done: #6CD39A;
  --done-soft: #16352A;
  --code-bg: #0A0F1A;
  --code-ink: #DCE5F7;
  --code-dim: #7D8BA8;
  --seg-1: #26355E;
  --seg-2: #3A519A;
  --seg-3: #8FA8FF;
  --seg-4: #6F5D12;
  --seg-ink-3: #0E1420;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
}
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

.shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1180px;
  margin: 0 auto;
  min-height: 100%;
}

/* Rail */
.rail {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  padding: 32px 20px 32px 24px;
  border-right: 1px solid var(--rule);
}
.brand {
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  font-weight: 800;
  font-size: 1.35rem;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.brand-sub { color: var(--ink-2); font-size: 0.95rem; margin: 0 0 20px; }
.meter { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-bottom: 6px; }
.meter > span { display: block; height: 100%; background: var(--done); width: 0; transition: width 0.4s ease; }
.meter-label { font-size: 0.9rem; color: var(--ink-2); margin-bottom: 20px; }
.days { list-style: none; margin: 0; padding: 0; position: relative; }
.days::before {
  content: "";
  position: absolute;
  left: 15px; top: 16px; bottom: 16px;
  width: 2px;
  background: var(--rule);
}
.days li { position: relative; }
.day-link {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 12px;
  align-items: center;
  padding: 8px 8px 8px 0;
  color: var(--ink);
  text-decoration: none;
  border-radius: 8px;
}
.day-link:hover .day-title { color: var(--blue); }
.dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  background: var(--surface);
  border: 2px solid var(--rule);
  position: relative;
  z-index: 1;
}
.day-link[aria-current="page"] .dot { background: var(--blue); border-color: var(--blue); color: var(--seg-ink-3); }
.day-link.is-done .dot { background: var(--done-soft); border-color: var(--done); color: var(--done); }
.day-link.is-done[aria-current="page"] .dot { background: var(--done); color: var(--surface); }
.day-meta { display: block; font-size: 0.82rem; color: var(--ink-2); line-height: 1.3; }
.day-title { display: block; font-weight: 600; line-height: 1.3; font-size: 0.98rem; }
.week-break {
  font-size: 0.85rem;
  color: var(--ink-2);
  padding: 14px 0 6px 48px;
}
.theme-toggle {
  margin-top: 24px;
  font: inherit;
  font-size: 0.9rem;
  color: var(--ink-2);
  background: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 4px 14px;
  cursor: pointer;
}

/* Main */
main { padding: 40px 48px 80px; min-width: 0; }
.day-head {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 28px;
  align-items: end;
  margin-bottom: 28px;
}
.big-num {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 800;
  font-size: clamp(5rem, 12vw, 8.5rem);
  line-height: 0.8;
  letter-spacing: -0.04em;
  color: var(--blue);
  grid-row: span 2;
}
.day-date { color: var(--ink-2); font-size: 1rem; margin: 0; }
h1 {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 800;
  font-size: clamp(1.8rem, 3.6vw, 2.6rem);
  line-height: 1.08;
  letter-spacing: -0.015em;
  margin: 0;
}
.lede { max-width: 66ch; font-size: 1.15rem; color: var(--ink); margin: 0 0 32px; }

/* Session bar */
.session { margin: 0 0 44px; }
.session h2 { margin-top: 0; }
.bar {
  display: flex;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--rule);
  min-height: 64px;
}
.seg {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  color: var(--ink);
}
.seg b { font-weight: 700; font-size: 0.98rem; line-height: 1.2; }
.seg span { font-size: 0.85rem; line-height: 1.25; opacity: 0.85; }
.seg.s1 { flex: 15; background: var(--seg-1); }
.seg.s2 { flex: 25; background: var(--seg-2); }
.seg.s3 { flex: 40; background: var(--seg-3); color: var(--seg-ink-3); }
.seg.s4 { flex: 10; background: var(--seg-4); }
.session-detail {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
}
.session-detail li { font-size: 0.95rem; line-height: 1.45; }
.session-detail strong { display: block; font-size: 0.85rem; color: var(--ink-2); font-weight: 600; }

/* Sections */
section.block { margin: 0 0 44px; max-width: 760px; }
h2 {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 700;
  font-size: 1.45rem;
  letter-spacing: -0.01em;
  margin: 0 0 12px;
}
h3 { font-size: 1.08rem; margin: 22px 0 6px; }
.prose p, .prose li { max-width: 68ch; }
.prose ul { padding-left: 1.2em; }
.prose li { margin-bottom: 4px; }
code {
  font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--blue-soft);
  padding: 1px 5px;
  border-radius: 4px;
}
table.ref {
  border-collapse: collapse;
  font-size: 0.97rem;
  margin: 12px 0;
  min-width: 420px;
}
.table-wrap { overflow-x: auto; }
table.ref th, table.ref td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.ref th { font-weight: 700; }
.mark { background: var(--mark); padding: 0 3px; border-radius: 2px; }

/* Code */
.code {
  background: var(--code-bg);
  border-radius: 10px;
  margin: 16px 0;
  overflow: hidden;
}
.code-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  color: var(--code-dim);
  font-size: 0.88rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.copy {
  font: inherit;
  font-size: 0.85rem;
  color: var(--code-ink);
  background: rgba(255, 255, 255, 0.08);
  border: 0;
  border-radius: 6px;
  padding: 3px 10px;
  cursor: pointer;
}
.code pre {
  margin: 0;
  padding: 14px 16px 16px;
  overflow-x: auto;
  color: var(--code-ink);
  font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.86rem;
  line-height: 1.55;
  tab-size: 4;
}
.code pre .cm { color: var(--code-dim); font-style: italic; }

/* Exercises */
.tasks { list-style: none; padding: 0; margin: 0; }
.tasks li {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.tasks input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--done); cursor: pointer; }
.tasks label { cursor: pointer; }
.tasks .is-checked label { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--done); }
.tag { font-size: 0.82rem; color: var(--ink-2); margin-left: 6px; }

/* Check yourself */
details {
  border-bottom: 1px solid var(--rule);
  padding: 10px 0;
}
summary { cursor: pointer; font-weight: 600; list-style-position: outside; }
details p { margin: 8px 0 2px; color: var(--ink); max-width: 66ch; }

/* Journal */
textarea {
  width: 100%;
  min-height: 150px;
  font: inherit;
  font-size: 1rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 12px 14px;
  resize: vertical;
}
.saved { font-size: 0.85rem; color: var(--ink-2); min-height: 1.2em; margin-top: 4px; }

/* Footer nav */
.day-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  max-width: 760px;
  border-top: 2px solid var(--ink);
  padding-top: 20px;
}
.btn {
  font: inherit;
  font-weight: 600;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.btn-primary { background: var(--blue); color: var(--seg-ink-3); border: 2px solid var(--blue); }
.btn-primary.is-done { background: var(--done-soft); color: var(--done); border-color: var(--done); }
.btn-ghost { background: none; color: var(--ink); border: 2px solid var(--rule); }
.btn-ghost[aria-disabled="true"] { visibility: hidden; }

:root { --slow: #B3412E; --slow-soft: #FBE3DE; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --slow: #F29682; --slow-soft: #3D1F1C; }
}
:root[data-theme="dark"] { --slow: #F29682; --slow-soft: #3D1F1C; }

/* Tamil box */
.ta {
  margin: 28px 0 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 5px solid var(--done);
  border-radius: 10px;
  padding: 18px 22px;
  font-family: "Noto Sans Tamil", "Source Sans 3", system-ui, sans-serif;
}
.ta h3 { margin: 0 0 10px; font-size: 1.12rem; font-family: inherit; }
.ta ul { padding-left: 1.2em; margin: 0; }
.ta li { font-size: 1rem; line-height: 1.8; margin-bottom: 8px; max-width: 70ch; }
.gloss {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 6px 18px;
  margin: 14px 0 0;
  padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-size: 0.97rem;
}
.gloss dt { font-weight: 700; font-family: "Source Sans 3", system-ui, sans-serif; }
.gloss dd { margin: 0; font-family: "Noto Sans Tamil", system-ui, sans-serif; }

/* Visuals */
.viz-intro { margin: 0 0 10px; color: var(--ink-2); }
.viz {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 20px;
  overflow-x: auto;
}
.viz-cap { font-size: 0.98rem; color: var(--ink); margin: 14px 0 0; min-height: 1.5em; max-width: 68ch; }
.viz-note { font-size: 0.85rem; color: var(--ink-2); margin: 10px 0 0; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.ctrls button {
  font: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 8px;
  border: 2px solid var(--blue);
  background: none;
  color: var(--blue);
  cursor: pointer;
}
.ctrls button.primary { background: var(--blue); color: var(--seg-ink-3); }
.ctrls button:disabled { opacity: 0.4; cursor: default; }
.step-n { font-size: 0.88rem; color: var(--ink-2); margin-left: auto; }
.ctrl-label { font-weight: 600; margin-right: 4px; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; }
.cell-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cell {
  min-width: 44px;
  height: 44px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border: 2px solid var(--rule);
  border-radius: 6px;
  background: var(--paper);
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-weight: 600;
  transition: background 0.2s, border-color 0.2s, opacity 0.2s;
}
.cell.on { border-color: var(--blue); background: var(--blue-soft); }
.cell.hot { border-color: var(--done); background: var(--done-soft); }
.cell.dim { opacity: 0.3; }
.cell.empty { border-style: dashed; }
.idx { font-size: 0.75rem; color: var(--ink-2); font-family: "JetBrains Mono", ui-monospace, monospace; }
.ptr { font-size: 0.78rem; font-weight: 700; color: var(--blue); min-height: 1.2em; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.88rem; color: var(--ink-2); margin: 0 0 14px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.hot, .sw.fast { background: var(--done); }
.sw.on { background: var(--blue); }
.sw.mid { background: var(--mark); border: 1px solid var(--ink-2); }
.sw.slow { background: var(--slow); }

.slider-label { display: flex; justify-content: space-between; font-weight: 600; }
.viz input[type="range"] { width: 100%; accent-color: var(--blue); margin: 10px 0 18px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 12px; align-items: center; }
.bar-k, .bar-v { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.88rem; }
.bar-v { text-align: right; }
.bar-track { height: 18px; background: var(--paper); border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); }
.bar-fill { display: block; height: 100%; transition: width 0.2s; }
.bar-fill.fast { background: var(--done); }
.bar-fill.mid { background: var(--blue); }
.bar-fill.slow { background: var(--slow); }

.ll { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ll-arrow { color: var(--ink-2); font-size: 1.2rem; }
.ll-label, .ll-null { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.88rem; color: var(--ink-2); font-weight: 600; }
.node { display: inline-flex; border: 2px solid var(--blue); border-radius: 8px; overflow: hidden; }
.node .nv { padding: 6px 12px; font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 700; }
.node .nn { padding: 6px 8px; font-size: 0.75rem; color: var(--ink-2); border-left: 1px solid var(--rule); background: var(--blue-soft); display: grid; place-items: center; }
.node.hot { border-color: var(--done); }
.node.hot .nv { background: var(--done-soft); }

.rv { display: flex; align-items: flex-start; gap: 2px; }
.rv-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 28px; }
.rv-arrow { height: 44px; display: grid; place-items: center; font-size: 1.4rem; color: var(--ink-2); min-width: 28px; }
.rv-null { height: 44px; display: grid; place-items: center; font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ink-2); font-size: 0.85rem; }

.dg { width: 100%; max-width: 680px; height: auto; display: block; }
.dg-box { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.25; }
.dg-accent { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
.dg-lines line { stroke: var(--ink-2); stroke-width: 1.25; }
.dg-head { fill: var(--ink-2); }
.dg-t { fill: var(--ink); font-weight: 700; font-size: 15px; text-anchor: middle; font-family: "Source Sans 3", system-ui, sans-serif; }
.dg-s { fill: var(--ink-2); font-size: 13px; text-anchor: middle; font-family: "Source Sans 3", system-ui, sans-serif; }
.dg-l { fill: var(--ink-2); font-size: 12.5px; font-style: italic; font-family: "Source Sans 3", system-ui, sans-serif; }

table.heat { border-collapse: separate; border-spacing: 6px; min-width: 480px; }
table.heat th { text-align: left; font-size: 0.95rem; font-weight: 600; padding-right: 6px; }
.hc {
  width: 100%;
  font: inherit;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 0.86rem;
  font-weight: 600;
  padding: 10px 8px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
}
.hc.fast { background: var(--done-soft); color: var(--done); }
.hc.mid { background: var(--mark); color: var(--ink); }
.hc.slow { background: var(--slow-soft); color: var(--slow); }
.hc[aria-pressed="true"] { border-color: var(--ink); }

.sq { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.sq-h { margin: 0 0 12px; font-size: 1rem; }
.stack { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 4px; min-height: 290px; }
.plate {
  width: 150px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--blue);
  border-radius: 17px;
  background: var(--blue-soft);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-weight: 600;
  position: relative;
}
.plate.top { border-color: var(--done); background: var(--done-soft); }
.tag-top { position: absolute; left: calc(100% + 8px); font-family: "Source Sans 3", system-ui, sans-serif; font-size: 0.82rem; color: var(--done); font-weight: 700; }
.queue { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 60px; }
.person { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--blue); background: var(--blue-soft); font-weight: 700; }
.queue .person:nth-child(2) { border-color: var(--done); background: var(--done-soft); }
.q-end { font-size: 0.82rem; color: var(--ink-2); font-weight: 700; }

.buckets { display: grid; gap: 6px; }
.bk { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 10px; min-height: 38px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.bk-i { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 600; color: var(--ink-2); text-align: right; }
.bk-chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { padding: 4px 12px; border-radius: 999px; border: 2px solid var(--blue); background: var(--blue-soft); font-weight: 600; font-size: 0.92rem; }
.pill.hot { border-color: var(--done); background: var(--done-soft); }

    <p>Big O describes how running time or memory <em>grows</em> as input size <code>n</code> grows. It ignores machine speed and constant factors, so you can compare algorithms on paper.</p>

import java.util.Set;

public class Complexity {
    // O(n) time, O(1) extra space
    static long sum(int[] a) {
        long total = 0;
        for (int x : a) total += x;
        return total;
    }

    // O(n^2) time, O(1) extra space
    static boolean hasDuplicateNaive(int[] a) {
        for (int i = 0; i < a.length; i++)
            for (int j = i + 1; j < a.length; j++)
                if (a[i] == a[j]) return true;
        return false;
    }

    // O(n) time, O(n) extra space: trade memory for speed
    static boolean hasDuplicateSet(int[] a) {
        Set<Integer> seen = new HashSet<>();
        for (int x : a) {
            if (!seen.add(x)) return true;
        }
        return false;
    }

            long t1 = System.nanoTime();
            hasDuplicateSet(a);
            long t2 = System.nanoTime();
            System.out.printf("n=%,d  naive=%d ms  set=%d ms%n",
                n, (t1 - t0) / 1_000_000, (t2 - t1) / 1_000_000);

    <h3>The costs that follow from contiguity</h3>

    <h3>How a dynamic array grows</h3>
    <p>A Java <code>int[]</code> has a fixed length. <code>ArrayList</code> hides this by allocating a bigger array and copying when it runs out of room. Copying is O(n), but if capacity <em>doubles</em> each time, copies are so rare that appending is <span class="mark">O(1) amortized</span>: averaged over many appends, each costs a constant.</p>
    <h3>Java tools you should know</h3>

public class DynamicArray<T> {
    private Object[] data = new Object[4];
    private int size = 0;

    // Amortized O(1): doubling makes resizes rare
    public void add(T value) {
        if (size == data.length) data = Arrays.copyOf(data, data.length * 2);
        data[size++] = value;
    }

    // O(1): direct index into contiguous memory
    @SuppressWarnings("unchecked")
    public T get(int index) {
        checkIndex(index);
        return (T) data[index];
    }

    // O(n): every element after index shifts left
    @SuppressWarnings("unchecked")
    public T remove(int index) {
        checkIndex(index);
        T removed = (T) data[index];
        System.arraycopy(data, index + 1, data, index, size - index - 1);
        data[--size] = null; // let the GC reclaim the reference
        return removed;
    }

    public int size() { return size; }

    private void checkIndex(int index) {
        if (index < 0 || index >= size)
            throw new IndexOutOfBoundsException("index " + index + ", size " + size);
    }
}` }],

  concept: `
    <p>Java <code>String</code> objects are <strong>immutable</strong>. Every <code>s + "x"</code> creates a new string, so concatenating in a loop is O(n²). Use <code>StringBuilder</code> instead, which appends in amortized O(1).</p>
    <p>For counting letters, an <code>int[26]</code> indexed by <code>c - 'a'</code> is faster and simpler than a map.</p>
    <h3>Pattern 1: two pointers</h3>

  snippets: [{ label: "Java: StringPatterns.java", src: String.raw`import java.util.HashMap;
import java.util.Map;

public class StringPatterns {
    // Two pointers: O(n) time, O(1) space
    static boolean isPalindrome(String s) {
        int left = 0, right = s.length() - 1;
        while (left < right) {
            char a = s.charAt(left), b = s.charAt(right);
            if (!Character.isLetterOrDigit(a)) { left++; continue; }
            if (!Character.isLetterOrDigit(b)) { right--; continue; }
            if (Character.toLowerCase(a) != Character.toLowerCase(b)) return false;
            left++;
            right--;
        }
        return true;
    }

    // Sliding window: O(n) time, O(k) space for k distinct characters
    static int longestUniqueSubstring(String s) {
        Map<Character, Integer> lastSeen = new HashMap<>();
        int best = 0, start = 0;
        for (int end = 0; end < s.length(); end++) {
            char c = s.charAt(end);
            if (lastSeen.containsKey(c) && lastSeen.get(c) >= start) {
                start = lastSeen.get(c) + 1; // shrink the window past the repeat
            }
            lastSeen.put(c, end);
            best = Math.max(best, end - start + 1);
        }
        return best;
    }
}` }],

import (
	"fmt"
	"strings"
)

type Node struct {
	Val  int
	Next *Node
}

type LinkedList struct {
	head *Node
	size int
}

// O(1)
func (l *LinkedList) PushFront(v int) {
	l.head = &Node{Val: v, Next: l.head}
	l.size++
}

// O(n): walk to the last node
func (l *LinkedList) Append(v int) {
	n := &Node{Val: v}
	l.size++
	if l.head == nil {
		l.head = n
		return
	}
	cur := l.head
	for cur.Next != nil {
		cur = cur.Next
	}
	cur.Next = n
}

// Dummy node removes the "delete the head" special case
func (l *LinkedList) Delete(v int) bool {
	dummy := &Node{Next: l.head}
	for prev := dummy; prev.Next != nil; prev = prev.Next {
		if prev.Next.Val == v {
			prev.Next = prev.Next.Next
			l.head = dummy.Next
			l.size--
			return true
		}
	}
	return false
}

func (l *LinkedList) String() string {
	var parts []string
	for cur := l.head; cur != nil; cur = cur.Next {
		parts = append(parts, fmt.Sprint(cur.Val))
	}
	return strings.Join(parts, " -> ")
}

func main() {
	l := &LinkedList{}
	l.Append(2)
	l.Append(3)
	l.PushFront(1)
	l.Delete(2)
	fmt.Println(l, "size:", l.size) // 1 -> 3 size: 2
}` },

  constructor(public value: T, public next: ListNode<T> | null = null) {}

export class LinkedList<T> {
  private head: ListNode<T> | null = null;
  private tail: ListNode<T> | null = null;
  private count = 0;

  prepend(value: T): void {            // O(1)
    this.head = new ListNode(value, this.head);
    if (this.tail === null) this.tail = this.head;
    this.count++;
  }

  append(value: T): void {             // O(1) thanks to the tail pointer
    const node = new ListNode(value);
    if (this.tail === null) {
      this.head = this.tail = node;
    } else {
      this.tail.next = node;
      this.tail = node;
    }
    this.count++;
  }

  toArray(): T[] {                     // O(n)
    const out: T[] = [];
    for (let cur = this.head; cur !== null; cur = cur.next) out.push(cur.value);
    return out;
  }

  get size(): number {
    return this.count;
  }
}

const list = new LinkedList<number>();
list.append(2);
list.append(3);
list.prepend(1);
console.log(list.toArray().join(" -> ")); // 1 -> 2 -> 3` }

  concept: `
    <h3>Technique 1: reverse in place</h3>
    <p>Walk the list with three references, <code>prev</code>, <code>cur</code> and <code>next</code>. Save <code>cur.next</code>, point <code>cur.next</code> back to <code>prev</code>, then advance. O(n) time, O(1) space.</p>
    <h3>Technique 2: fast and slow pointers</h3>
    <p>Move <code>slow</code> one step and <code>fast</code> two. If there is a cycle they meet; if not, <code>fast</code> hits the end. When <code>fast</code> reaches the end, <code>slow</code> sits in the middle. This is Floyd’s algorithm.</p>
    <h3>Technique 3: dummy head when building</h3>
    <p>When merging or building a new list, start from a dummy node and append to a <code>tail</code> reference. Return <code>dummy.next</code>.</p>
    <h3>The Iterator pattern</h3>
    <p>Iterator gives callers a way to visit every element <span class="mark">without knowing how the collection is stored</span>. In Java, implementing <code>Iterable&lt;T&gt;</code> lets anyone write <code>for (T x : list)</code> while <code>Node</code> stays private. That is encapsulation and a GoF behavioral pattern in one step.</p>`,
  snippets: [{ label: "Java: SinglyLinkedList.java", src: String.raw`import java.util.Iterator;
import java.util.NoSuchElementException;

public class SinglyLinkedList<T> implements Iterable<T> {
    private static class Node<T> {
        T value;
        Node<T> next;
        Node(T value) { this.value = value; }
    }

    private Node<T> head;

    public void addFirst(T value) {
        Node<T> n = new Node<>(value);
        n.next = head;
        head = n;
    }

    // Reverse in place: O(n) time, O(1) space
    public void reverse() {
        Node<T> prev = null, cur = head;
        while (cur != null) {
            Node<T> next = cur.next; // save the rest of the list
            cur.next = prev;         // flip the pointer
            prev = cur;
            cur = next;
        }
        head = prev;
    }

    // Floyd's fast and slow pointers: O(n) time, O(1) space
    public boolean hasCycle() {
        Node<T> slow = head, fast = head;
        while (fast != null && fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
            if (slow == fast) return true;
        }
        return false;
    }

    // Iterator pattern: callers traverse without seeing Node
    @Override
    public Iterator<T> iterator() {
        return new Iterator<>() {
            private Node<T> cur = head;

            public boolean hasNext() { return cur != null; }

            public T next() {
                if (cur == null) throw new NoSuchElementException();
                T value = cur.value;
                cur = cur.next;
                return value;
            }
        };
    }
}` }],

    <p>A <strong>stack</strong> is last in, first out (LIFO): push and pop happen at the same end. A <strong>queue</strong> is first in, first out (FIFO): add at the back, remove from the front. Both do their core operations in O(1).</p>
    <div class="table-wrap"><table class="ref">
      <tr><th>Structure</th><th>Typical uses</th></tr>
      <tr><td>Stack</td><td>Undo, matching brackets, expression parsing, DFS, the call stack itself</td></tr>
      <tr><td>Queue</td><td>Task scheduling, BFS, message buffers, rate limiting</td></tr>
    </table></div>
    <h3>Which Java class to use</h3>
    <p>Use <code>ArrayDeque</code> for both. It works as a stack (<code>push</code>, <code>pop</code>, <code>peek</code>) and as a queue (<code>offer</code>, <code>poll</code>, <code>peek</code>). Avoid the old <code>Stack</code> class: it extends <code>Vector</code>, so every call is synchronized and slower.</p>
    <h3>Circular buffer</h3>
    <p>A queue built on an array would need to shift elements after every removal. Instead, keep a <code>head</code> index and wrap around with modulo: <span class="mark">the next slot is <code>(head + size) % capacity</code></span>. Both ends stay O(1).</p>`,
  snippets: [
    { label: "Java: Brackets.java", src: String.raw`import java.util.ArrayDeque;
import java.util.Deque;
import java.util.Map;

public class Brackets {
    // Stack: O(n) time, O(n) space
    static boolean isValid(String s) {
        Map<Character, Character> pairs = Map.of(')', '(', ']', '[', '}', '{');
        Deque<Character> stack = new ArrayDeque<>();
        for (char c : s.toCharArray()) {
            if (pairs.containsKey(c)) {
                if (stack.isEmpty() || !stack.pop().equals(pairs.get(c))) return false;
            } else {
                stack.push(c);
            }
        }
        return stack.isEmpty();
    }
}` },
    { label: "Java: ArrayQueue.java", src: String.raw`public class ArrayQueue<T> {
    private final Object[] data;
    private int head = 0, size = 0;

    public ArrayQueue(int capacity) { data = new Object[capacity]; }

    // O(1): the tail wraps around with modulo
    public boolean offer(T value) {
        if (size == data.length) return false;
        data[(head + size) % data.length] = value;
        size++;
        return true;
    }

    // O(1): no shifting, just move head forward
    @SuppressWarnings("unchecked")
    public T poll() {
        if (size == 0) return null;
        T value = (T) data[head];
        data[head] = null;
        head = (head + 1) % data.length;
        size--;
        return value;
    }

    public int size() { return size; }
}` }

  code: "Implement MyHashMap<K, V> with separate chaining",
  concept: `
    <p>A hash map turns a key into an array index: compute <code>key.hashCode()</code>, then reduce it to a bucket number. Lookups jump straight to one bucket, which is why <code>get</code> and <code>put</code> are <strong>O(1) on average</strong>.</p>
    <h3>Collisions</h3>
    <p>Different keys can land in the same bucket. Java’s <code>HashMap</code> stores them in a chain inside the bucket. If one chain grows past 8 entries (and the table has at least 64 buckets), Java converts it to a red-black tree, so the worst case becomes O(log n) instead of O(n).</p>
    <h3>Load factor and resizing</h3>
    <p>When entries exceed <code>capacity × 0.75</code>, the table doubles and every entry is redistributed. Capacity stays a power of two so the bucket can be computed with a fast bit mask: <code>hash &amp; (capacity - 1)</code>.</p>
    <h3>The contract</h3>
    <p><span class="mark">If two objects are equal, they must have the same hashCode.</span> Override <code>equals</code> without <code>hashCode</code> and two “equal” keys land in different buckets, so <code>get</code> returns <code>null</code> for a key you just put. Java records generate both for you.</p>
    <p><code>HashSet</code> is a <code>HashMap</code> that stores only keys, so everything here applies to it too.</p>`,
  snippets: [{ label: "Java: MyHashMap.java", src: String.raw`import java.util.LinkedList;
import java.util.Objects;

public class MyHashMap<K, V> {
    private static class Entry<K, V> {
        final K key;
        V value;
        Entry(K key, V value) { this.key = key; this.value = value; }
    }

    private static final double LOAD_FACTOR = 0.75;
    private LinkedList<Entry<K, V>>[] buckets;
    private int size = 0;

    @SuppressWarnings("unchecked")
    public MyHashMap() { buckets = new LinkedList[16]; }

    private static int indexFor(Object key, int length) {
        int h = (key == null) ? 0 : key.hashCode();
        h ^= (h >>> 16);         // mix high bits into low bits, like java.util.HashMap
        return h & (length - 1); // length is always a power of two
    }

    public V get(K key) {
        LinkedList<Entry<K, V>> bucket = buckets[indexFor(key, buckets.length)];
        if (bucket == null) return null;
        for (Entry<K, V> e : bucket)
            if (Objects.equals(e.key, key)) return e.value;
        return null;
    }

    public V put(K key, V value) {
        int i = indexFor(key, buckets.length);
        if (buckets[i] == null) buckets[i] = new LinkedList<>();
        for (Entry<K, V> e : buckets[i]) {
            if (Objects.equals(e.key, key)) { // existing key: replace the value
                V old = e.value;
                e.value = value;
                return old;
            }
        }
        buckets[i].add(new Entry<>(key, value));
        if (++size > buckets.length * LOAD_FACTOR) resize();
        return null;
    }

    @SuppressWarnings("unchecked")
    private void resize() {
        LinkedList<Entry<K, V>>[] old = buckets;
        buckets = new LinkedList[old.length * 2];
        for (LinkedList<Entry<K, V>> bucket : old) {
            if (bucket == null) continue;
            for (Entry<K, V> e : bucket) {
                int i = indexFor(e.key, buckets.length);
                if (buckets[i] == null) buckets[i] = new LinkedList<>();
                buckets[i].add(e);
            }
        }
    }

    public int size() { return size; }
}` }],

  concept: `
    <h3>Searching</h3>
    <p>Linear search checks every element: O(n), works on anything. <strong>Binary search</strong> needs a sorted array and halves the range each step: O(log n). On a million items that’s at most 20 comparisons.</p>
    <p>Most binary search bugs are off-by-one errors. Pick one convention and always use it: <code>lo = 0</code>, <code>hi = n - 1</code>, loop <code>while (lo &lt;= hi)</code>, and compute <code>mid = lo + (hi - lo) / 2</code> to avoid integer overflow.</p>
    <h3>Sorting</h3>
    <div class="table-wrap"><table class="ref">
      <tr><th>Algorithm</th><th>Time (average)</th><th>Worst</th><th>Extra space</th><th>Stable</th></tr>
      <tr><td>Bubble, insertion</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>Yes</td></tr>
      <tr><td>Merge sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>Yes</td></tr>
      <tr><td>Quick sort</td><td>O(n log n)</td><td>O(n²)</td><td>O(log n)</td><td>No</td></tr>
      <tr><td>Heap sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(1)</td><td>No</td></tr>
    </table></div>
    <p><strong>Stable</strong> means equal elements keep their original order, which matters when you sort records by one field after another.</p>
    <p>In practice, Java’s <code>Arrays.sort</code> uses dual-pivot quick sort for primitives and TimSort (a stable merge-sort hybrid) for objects. <span class="mark">Know how they work; use the library in real code.</span></p>`,
  snippets: [{ label: "Java: SearchSort.java", src: String.raw`import java.util.Arrays;

public class SearchSort {
    // O(log n): halve the search space each step
    static int binarySearch(int[] a, int target) {
        int lo = 0, hi = a.length - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2; // avoids overflow of (lo + hi)
            if (a[mid] == target) return mid;
            if (a[mid] < target) lo = mid + 1;
            else hi = mid - 1;
        }
        return -1;
    }

    // O(n log n) time, O(n) extra space, stable
    static void mergeSort(int[] a) {
        if (a.length < 2) return;
        int mid = a.length / 2;
        int[] left = Arrays.copyOfRange(a, 0, mid);
        int[] right = Arrays.copyOfRange(a, mid, a.length);
        mergeSort(left);
        mergeSort(right);
        int i = 0, j = 0, k = 0;
        while (i < left.length && j < right.length)
            a[k++] = (left[i] <= right[j]) ? left[i++] : right[j++]; // <= keeps it stable
        while (i < left.length) a[k++] = left[i++];
        while (j < right.length) a[k++] = right[j++];
    }

    public static void main(String[] args) {
        int[] a = {5, 2, 9, 1, 5, 6};
        mergeSort(a);
        System.out.println(Arrays.toString(a));  // [1, 2, 5, 5, 6, 9]
        System.out.println(binarySearch(a, 6));  // 4
    }
}` }],

function stepper(el, steps, draw) {
  let i = 0;
  const ctr = document.createElement("div");
  ctr.className = "ctrls";
  ctr.innerHTML = `<button type="button" data-a="prev">Back</button><button type="button" class="primary" data-a="next">Next step</button><button type="button" data-a="reset">Reset</button><span class="step-n" aria-live="polite"></span>`;
  el.appendChild(ctr);
  const paint = () => {
    draw(steps[i], i);
    ctr.querySelector(".step-n").textContent = `Step ${i + 1} of ${steps.length}`;
    ctr.querySelector('[data-a="prev"]').disabled = i === 0;
    ctr.querySelector('[data-a="next"]').disabled = i === steps.length - 1;
  };
  ctr.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const a = b.dataset.a;
    if (a === "prev" && i > 0) i--;
    if (a === "next" && i < steps.length - 1) i++;
    if (a === "reset") i = 0;
    paint();
  });
  paint();
  return { reset(next) { steps = next; i = 0; paint(); } };
}

      note = `“${c}” is already inside the window (at index ${last[c]}), so start jumps to ${start}.`;
    } else {
      note = `“${c}” is new, so the window simply grows.`;
    }
    last[c] = end;
    best = Math.max(best, end - start + 1);
    steps.push({ start, end, best, note: `${note} Window = “${s.slice(start, end + 1)}”, longest so far = ${best}.` });
  }
  steps[steps.length - 1].note += " Done: the answer is 3.";
  el.innerHTML = `<p class="legend"><span><span class="sw on"></span>Inside the window</span><span><span class="sw hot"></span>Letter being read</span></p><div class="cells" id="sw-cells"></div><p class="viz-cap" id="sw-cap"></p>`;
  const draw = st => {
    el.querySelector("#sw-cells").innerHTML = [...s].map((ch, i) => {
      const inWin = st.end >= 0 && i >= st.start && i <= st.end;
      const cls = i === st.end ? "hot" : inWin ? "on" : "";
      const labels = [];
      if (st.end >= 0 && i === st.start) labels.push("start");
      if (i === st.end) labels.push("end");
      return `<div class="cell-col"><div class="cell ${cls}">${ch}</div><div class="idx">${i}</div><div class="ptr">${labels.join(" ")}</div></div>`;
    }).join("");
    el.querySelector("#sw-cap").textContent = st.note;
  };
  stepper(el, steps, draw);
};

VIS.list = el => {
  const intro = "head points at the first node. Each node holds a value and the address of the next one.";
  let vals = [1, 2, 3], nextV = 4, hot = -1;
  el.innerHTML = `<div class="ll" id="ll"></div><p class="viz-cap" id="ll-cap">${intro}</p><div class="ctrls"><button type="button" class="primary" data-a="front">PushFront</button><button type="button" data-a="append">Append</button><button type="button" data-a="del">Delete head</button><button type="button" data-a="reset">Reset</button></div>`;
  const capEl = el.querySelector("#ll-cap");
  const draw = () => {
    el.querySelector("#ll").innerHTML = `<span class="ll-label">head</span><span class="ll-arrow">→</span>` +
      vals.map((v, i) => `<span class="node${i === hot ? " hot" : ""}"><span class="nv">${v}</span><span class="nn">next</span></span><span class="ll-arrow">→</span>`).join("") +
      `<span class="ll-null">nil</span>`;
  };
  el.querySelector(".ctrls").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const a = b.dataset.a;
    if ((a === "front" || a === "append") && vals.length >= 8) {
      capEl.textContent = "Eight nodes is plenty. Delete or reset first.";
      return;
    }
    if (a === "front") {
      const v = nextV++;
      vals.unshift(v);
      hot = 0;
      capEl.textContent = `Node ${v} now points at the old first node, then head moves to ${v}. One step, however long the list is: O(1).`;
    }
    if (a === "append") {
      const v = nextV++;
      const walked = vals.length;
      vals.push(v);
      hot = vals.length - 1;
      capEl.textContent = walked === 0
        ? `The list was empty, so node ${v} became the head.`
        : `Walked past ${walked} node${walked === 1 ? "" : "s"} to find the end, then linked node ${v}. The walk grows with the list: O(n). A tail pointer would make this O(1).`;
    }
    if (a === "del") {
      if (!vals.length) {
        capEl.textContent = "Nothing to delete: the list is empty.";
      } else {

    }
    if (a === "reset") { vals = [1, 2, 3]; nextV = 4; hot = -1; capEl.textContent = intro; }
    draw();
  });

};

VIS.reverse = el => {
  const V = [1, 2, 3, 4];
  const name = i => (i === null ? "null" : `node ${V[i]}`);
  const steps = [];
  const link = [1, 2, 3, null];
  let prev = null, cur = 0;
  steps.push({ link: [...link], prev, cur, note: "Start: prev = null, cur = node 1. Every arrow still points right." });
  while (cur !== null) {
    const nxt = link[cur];
    link[cur] = prev;
    const flipped = cur;
    prev = cur;
    cur = nxt;
    steps.push({ link: [...link], prev, cur, note: `Saved next = ${name(nxt)}. Flipped ${name(flipped)} to point back at ${name(link[flipped])}. Moved prev to ${name(prev)} and cur to ${name(cur)}.` });
  }
  steps[steps.length - 1].note += " cur is null, so stop: head = prev = node 4. The list now reads 4 → 3 → 2 → 1.";
  el.innerHTML = `<p class="legend"><span><span class="sw hot"></span>cur</span><span><span class="sw on"></span>prev</span></p><div class="rv" id="rv"></div><p class="viz-cap" id="rv-cap"></p>`;
  const col = (top, label) => `<div class="rv-col">${top}<div class="ptr">${label}</div></div>`;
  const draw = st => {
    const parts = [];
    parts.push(col(`<div class="rv-null">null</div>`, st.prev === null ? "prev" : ""));
    parts.push(col(`<div class="rv-arrow">${st.link[0] === null ? "←" : ""}</div>`, ""));
    V.forEach((v, i) => {
      const lbl = [st.prev === i ? "prev" : "", st.cur === i ? "cur" : ""].filter(Boolean).join(" ");
      const cls = st.cur === i ? "hot" : st.prev === i ? "on" : "";
      parts.push(col(`<div class="cell ${cls}">${v}</div>`, lbl));
      if (i < V.length - 1) {
        const arrow = st.link[i] === i + 1 ? "→" : st.link[i + 1] === i ? "←" : "";
        parts.push(col(`<div class="rv-arrow">${arrow}</div>`, ""));
      }
    });
    parts.push(col(`<div class="rv-arrow">${st.link[3] === null ? "→" : ""}</div>`, ""));
    parts.push(col(`<div class="rv-null">null</div>`, st.cur === null ? "cur" : ""));
    el.querySelector("#rv").innerHTML = parts.join("");
    el.querySelector("#rv-cap").textContent = st.note;
  };
  stepper(el, steps, draw);
};

VIS.hash = el => {
  const foods = ["idli", "dosa", "vada", "pongal", "poori", "upma", "bonda", "halwa", "kesari", "appam", "murukku", "payasam"];
  const hash = s => [...s].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  let B, buckets, k, last;
  el.innerHTML = `<div class="buckets" id="hm"></div><p class="viz-cap" id="hm-cap"></p><div class="ctrls"><button type="button" class="primary" data-a="put"></button><button type="button" data-a="reset">Reset</button><span class="step-n" id="hm-load"></span></div><p class="viz-note">Simplified hash for learning: add up the letter codes. Java’s real hashCode is different, but the idea is the same.</p>`;
  const capEl = el.querySelector("#hm-cap");
  const size = () => buckets.reduce((a, b) => a + b.length, 0);
  const draw = () => {
    el.querySelector("#hm").innerHTML = buckets.map((b, i) => `<div class="bk"><span class="bk-i">${i}</span><span class="bk-chain">${b.length ? b.map(x => `<span class="pill${x === last ? " hot" : ""}">${x}</span>`).join('<span class="ll-arrow">→</span>') : '<span class="bk-empty">empty</span>'}</span></div>`).join("");
    const btn = el.querySelector('[data-a="put"]');
    btn.disabled = k >= foods.length;
    btn.textContent = k < foods.length ? `Put “${foods[k]}”` : "All items added";
    el.querySelector("#hm-load").textContent = `Load: ${size()} items / ${B} buckets = ${(size() / B).toFixed(2)}`;
  };
  const reset = () => {
    B = 4;
    buckets = Array.from({ length: B }, () => []);
    k = 0;
    last = null;
    capEl.textContent = "4 empty buckets. Press Put to add the first item.";
    draw();
  };
  el.querySelector(".ctrls").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.a === "reset") { reset(); return; }
    if (b.dataset.a !== "put" || k >= foods.length) return;
    const key = foods[k++];
    const h = hash(key);
    const i = h % B;
    const had = buckets[i].length;
    buckets[i].push(key);
    last = key;
    let msg = `hash(“${key}”) = ${h}. ${h} % ${B} = ${i}, so it goes into bucket ${i}.`;
    if (had) msg += ` Bucket ${i} already had ${had} item${had > 1 ? "s" : ""}: that’s a collision, so it joins the chain.`;
    if (size() > B * 0.75) {
      const old = B;
      B *= 2;
      const all = buckets.flat();
      buckets = Array.from({ length: B }, () => []);
      all.forEach(x => buckets[hash(x) % B].push(x));
      msg += ` Now ${all.length} items in ${old} buckets is over the 0.75 load factor, so the map doubled to ${B} buckets and re-placed every item.`;
    }
    capEl.textContent = msg;
    draw();
  });
  reset();
};

VIS.bsearch = el => {
  const arr = [2, 5, 8, 12, 16, 23, 38, 45, 56, 72, 91];
  const build = t => {
    let lo = 0, hi = arr.length - 1, cmp = 0;
    const steps = [{ lo, hi, mid: -1, note: `Looking for ${t} in 11 sorted numbers. lo = 0, hi = 10.` }];
    while (lo <= hi) {
      const mid = lo + Math.floor((hi - lo) / 2);
      const v = arr[mid];
      cmp++;
      if (v === t) {
        steps.push({ lo, hi, mid, found: true, note: `mid = ${mid}, a[mid] = ${v}. Found it in ${cmp} comparison${cmp > 1 ? "s" : ""}. A linear search would need ${mid + 1}.` });
        return steps;
      }
      if (v < t) {
        steps.push({ lo, hi, mid, note: `mid = ${mid}, a[mid] = ${v} is smaller than ${t}, so the whole left half is out. Next: lo = ${mid + 1}.` });
        lo = mid + 1;
      } else {
        steps.push({ lo, hi, mid, note: `mid = ${mid}, a[mid] = ${v} is bigger than ${t}, so the whole right half is out. Next: hi = ${mid - 1}.` });
        hi = mid - 1;
      }
    }
    steps.push({ lo, hi, mid: -1, note: `lo (${lo}) has passed hi (${hi}), so ${t} isn’t in the array. Only ${cmp} comparisons to be sure.` });
    return steps;
  };
  el.innerHTML = `<div class="ctrls" id="bs-t" style="margin-top:0"><span class="ctrl-label">Find</span><button type="button" data-t="23" class="primary">23</button><button type="button" data-t="72">72</button><button type="button" data-t="7">7</button></div><div class="cells" id="bs-cells" style="margin-top:16px"></div><p class="viz-cap" id="bs-cap"></p>`;
  const draw = st => {
    el.querySelector("#bs-cells").innerHTML = arr.map((v, i) => {
      const out = i < st.lo || i > st.hi;
      const cls = i === st.mid ? (st.found ? "hot" : "on") : out ? "dim" : "";
      const labels = [];
      if (i === st.lo) labels.push("lo");
      if (i === st.hi) labels.push("hi");
      if (i === st.mid) labels.push("mid");
      return `<div class="cell-col"><div class="cell ${cls}">${v}</div><div class="idx">${i}</div><div class="ptr">${labels.join(" ")}</div></div>`;
    }).join("");
    el.querySelector("#bs-cap").textContent = st.note;
  };
  const st = stepper(el, build(23), draw);
  el.querySelector("#bs-t").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    el.querySelectorAll("#bs-t button").forEach(x => x.classList.toggle("primary", x === b));
    st.reset(build(Number(b.dataset.t)));
  });
};

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function highlightComments(src) {
  return src.split("\n").map(line => {
    const esc = escapeHtml(line);
    const idx = line.indexOf("//");
    if (idx === -1 || line.slice(0, idx).includes("\"")) return esc;
    const before = escapeHtml(line.slice(0, idx));
    const comment = escapeHtml(line.slice(idx));
    return `${before}<span class="cm">${comment}</span>`;
  }).join("\n");
}

        <li><strong>Code</strong><span id="cod"></span></li>
        <li><strong>Journal</strong>Answer the prompts at the bottom of this page</li>
      </ul>
    </section>

    <section class="block prose" aria-labelledby="h-learn">
      <h2 id="h-learn">Learn</h2>
      ${d.concept}
      ${tamilBox(d.tamil)}
    </section>

    <section class="block" aria-labelledby="h-see">
      <h2 id="h-see">See it</h2>
      <p class="viz-intro"></p>
      <div class="viz" id="viz"></div>
    </section>

    <section class="block" aria-labelledby="h-code">
      <h2 id="h-code">Code</h2>
      <div id="snippets"></div>
    </section>

    <section class="block" aria-labelledby="h-practice">
      <h2 id="h-practice">Practice</h2>
      <ul class="tasks" id="tasks"></ul>
    </section>

    <section class="block" aria-labelledby="h-check">
      <h2 id="h-check">Check yourself</h2>
      <div id="checks"></div>
    </section>

    <section class="block" aria-labelledby="h-journal">
      <h2 id="h-journal">Journal</h2>
      <ul class="prose" id="prompts"></ul>
      <label for="notes" class="prose" style="display:block;margin:4px 0 8px;color:var(--ink-2);font-size:0.95rem">Your notes for Day ${n}, saved in this browser</label>
      <textarea id="notes"></textarea>
      <div class="saved" id="saved" aria-live="polite"></div>
    </section>

    <footer class="day-foot">
      <a class="btn btn-ghost" id="prev" href="#day-${n - 1}">Day ${n - 1}</a>
      <button class="btn btn-primary" id="complete" type="button"></button>
      <a class="btn btn-ghost" id="next" href="#day-${n + 1}">Day ${n + 1}</a>
    </footer>`;

  main.querySelector("h1").textContent = d.title;
  main.querySelector(".lede").textContent = d.lede;
  document.getElementById("rev").textContent = revise.join("; ");
  document.getElementById("lrn").textContent = d.learn;
  document.getElementById("cod").textContent = d.code;
  main.querySelector(".viz-intro").textContent = d.visIntro;
  VIS[d.vis](document.getElementById("viz"));

  const snip = document.getElementById("snippets");
  d.snippets.forEach(s => {
    const wrap = document.createElement("div");
    wrap.className = "code";
    wrap.innerHTML = `<div class="code-head"><span></span><button class="copy" type="button">Copy</button></div><pre><code style="background:none;padding:0;font-size:inherit"></code></pre>`;
    wrap.querySelector(".code-head span").textContent = s.label;
    wrap.querySelector("pre code").innerHTML = highlightComments(s.src);
    const btn = wrap.querySelector(".copy");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(s.src);
        btn.textContent = "Copied";
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(wrap.querySelector("pre"));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = "Selected, press Ctrl+C";
      }
      setTimeout(() => { btn.textContent = "Copy"; }, 1800);
    });
    snip.appendChild(wrap);
  });

  const tasks = document.getElementById("tasks");
  d.tasks.forEach((t, i) => {
    const id = `d${n}-t${i}`;
    const li = document.createElement("li");
    if (state.tasks[id]) li.classList.add("is-checked");
    li.innerHTML = `<input type="checkbox" id="${id}"><label for="${id}"></label>`;
    const label = li.querySelector("label");
    if (t.url) {
      const a = document.createElement("a");
      a.href = t.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = t.t;
      label.appendChild(a);
    } else {
      label.textContent = t.t;
    }
    if (t.tag) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = t.tag;
      label.appendChild(tag);
    }
    const box = li.querySelector("input");
    box.checked = !!state.tasks[id];
    box.addEventListener("change", () => {
      state.tasks[id] = box.checked;
      li.classList.toggle("is-checked", box.checked);
      save();
    });
    tasks.appendChild(li);
  });

  const checks = document.getElementById("checks");
  d.checks.forEach(c => {
    const det = document.createElement("details");
    det.innerHTML = "<summary></summary><p></p>";
    det.querySelector("summary").textContent = c.q;
    det.querySelector("p").textContent = c.a;
    checks.appendChild(det);
  });

  const prompts = document.getElementById("prompts");
  d.journal.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p;
    prompts.appendChild(li);
  });

  const notes = document.getElementById("notes");
  const saved = document.getElementById("saved");
  notes.value = state.notes[n] || "";
  let timer;
  notes.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      state.notes[n] = notes.value;
      save();
      saved.textContent = "Saved";
    }, 400);
  });

  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  if (n === 1) { prev.setAttribute("aria-disabled", "true"); prev.tabIndex = -1; }
  if (n === DAYS.length) { next.setAttribute("aria-disabled", "true"); next.tabIndex = -1; }

  const complete = document.getElementById("complete");
  const paint = () => {
    complete.textContent = state.done[n] ? `Day ${n} complete` : `Mark Day ${n} complete`;
    complete.classList.toggle("is-done", !!state.done[n]);
  };
  paint();
  complete.addEventListener("click", () => {
    state.done[n] = !state.done[n];
    save();
    paint();
    renderRail(n);
  });
}

function route() {
  const m = /^#day-(\d+)$/.exec(location.hash);
  let n = m ? Number(m[1]) : 1;
  if (!(n >= 1 && n <= DAYS.length)) n = 1;
  renderRail(n);
  renderDay(n);
  document.title = `Day ${n}: ${DAYS[n - 1].title}`;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => {
  route();
  document.getElementById("main").focus({ preventScroll: true });
});
route();

document.getElementById("theme-toggle").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nextTheme = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", nextTheme);
  try { localStorage.setItem(STORE_KEY + "-theme", nextTheme); } catch (e) { /* ignore */ }
});
try {
  const t = localStorage.getItem(STORE_KEY + "-theme");
  if (t) document.documentElement.setAttribute("data-theme", t);
} catch (e) { /* ignore */ }
</script>
</body>
</html>
